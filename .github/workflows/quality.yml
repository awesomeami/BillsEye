name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      VITE_FIREBASE_PROJECT_ID: kharchalens-ci
      VITE_FIREBASE_APP_ID: 123456789:123456789:web:ci
      VITE_FIREBASE_AUTH_DOMAIN: kharchalens-ci.firebaseapp.com
      VITE_FIREBASE_DATABASE_ID: (default)
      VITE_FIREBASE_API_KEY: ci-api-key
      VITE_FIREBASE_STORAGE_BUCKET: kharchalens-ci.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      FIREBASE_PROJECT_ID: kharchalens-ci
      FIREBASE_DATABASE_ID: (default)
      FIREBASE_ADMIN_USE_ADC: 'true'
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browser used by mocked end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run lint, types, tests, emulator, browser journey, and build
        run: npm run update-report

      - name: Upload generated verification report and failed browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: |
            TEST_REPORT.md
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
